services:
  db:
    image: postgis/postgis:16-3.4
    container_name: iluminaxingu-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: iluminaxingu
      POSTGRES_PASSWORD: iluminaxingu
      POSTGRES_DB: iluminaxingu
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata:
